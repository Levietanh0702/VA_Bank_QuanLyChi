<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VA BANK - Đăng nhập</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="phone-frame">
    <div class="screen">

      <!-- Icon thông báo góc trên -->
      <div class="top-bar">
        <i class="fa-regular fa-bell"></i>
      </div>

      <!-- Logo -->
      <div class="logo-area">
        <div class="logo-circle">
          <i class="fa-solid fa-dove logo-icon"></i>
        </div>
        <h1 class="brand-name">VA BANK</h1>
      </div>

      <!-- Form đăng nhập -->
      <div class="login-card">
        <p class="greeting">Xin chào !</p>

        <div id="errorBox" class="error-box" style="display:none;"></div>

        <form id="loginForm">
          <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Đăng nhập" autocomplete="username" required />
          </div>

          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Mật khẩu" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn-login" id="btnLogin">Đăng nhập</button>
        </form>

        <button type="button" class="btn-register" id="btnRegister">Đăng ký</button>
      </div>

    </div>
  </div>

  <!-- Modal đăng ký nhanh -->
  <div id="registerModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>Đăng ký tài khoản</h3>
      <input type="text" id="regFullName" placeholder="Họ và tên" />
      <input type="text" id="regUsername" placeholder="Tên đăng nhập" />
      <input type="password" id="regPassword" placeholder="Mật khẩu" />
      <div id="regErrorBox" class="error-box" style="display:none;"></div>
      <div class="modal-actions">
        <button id="regCancel" class="btn-secondary">Hủy</button>
        <button id="regSubmit" class="btn-login">Đăng ký</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
